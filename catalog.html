<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Catálogo - OshaQuest TCG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            oshawott: {
              blue: '#0072CE',
              darkBlue: '#0055A5',
              sky: '#E6F3FF',
              bg: '#F8FAFC',
              text: '#0F172A',
              muted: '#64748B'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-oshawott-bg text-oshawott-text font-sans antialiased min-h-screen flex flex-col">

  <!-- ENCABEZADO -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-3 group">
        <img src="logo.jpg" alt="Logo Oshawott TCG" class="h-12 w-12 object-contain group-hover:scale-105 transition-transform" />
        <div>
          <span class="text-2xl font-extrabold tracking-tight text-oshawott-blue block leading-none">
            OshaQuest <span class="text-slate-800">TCG</span>
          </span>
        </div>
      </a>

      <!-- NAVEGACIÓN CORREGIDA CON IDS -->
      <nav class="hidden md:flex items-center gap-6 font-bold text-sm text-slate-700">
        <a href="catalog.html?category=etb" id="nav-etb" class="hover:text-oshawott-blue transition">ELITE TRAINER BOX</a>
        <a href="catalog.html?category=boosters" id="nav-boosters" class="hover:text-oshawott-blue transition">BOOSTERS</a>
        <a href="catalog.html?category=colecciones" id="nav-colecciones" class="hover:text-oshawott-blue transition">COLECCIONES</a>
        <a href="catalog.html?category=latas" id="nav-latas" class="hover:text-oshawott-blue transition">LATAS</a>
        <a href="catalog.html?category=blisters" id="nav-blisters" class="hover:text-oshawott-blue transition">BLISTERS</a>
      </nav>

      <div class="flex items-center gap-3">
        <a href="#" class="flex items-center gap-2 font-bold text-sm text-slate-700 hover:text-oshawott-blue px-3 py-2 rounded-lg hover:bg-oshawott-sky transition">
          <svg class="w-5 h-5 text-oshawott-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          <span class="hidden sm:inline">PERFIL</span>
        </a>
        <button class="relative bg-oshawott-blue hover:bg-oshawott-darkBlue text-white p-2.5 rounded-xl transition shadow-md shadow-oshawott-blue/20">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"></path>
          </svg>
          <span class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[11px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- BREADCRUMBS -->
  <section class="bg-oshawott-blue text-white py-3 shadow-inner">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center gap-2 text-xs font-semibold opacity-90">
      <a href="index.html" class="hover:underline">Home</a>
      <span>&gt;</span>
      <span id="breadcrumb-category">Elite Trainer Box</span>
    </div>
  </section>

  <!-- CONTENIDO -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    <h1 id="catalog-title" class="text-2xl font-black text-slate-800 mb-6 uppercase tracking-tight">
      Catálogo
    </h1>

    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
      <div class="relative w-full md:w-96">
        <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="Buscar por nombre..." class="w-full pl-10 pr-4 py-2 border-2 border-slate-200 rounded-lg text-sm focus:border-oshawott-blue focus:outline-none transition"/>
        <svg class="w-5 h-5 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>

      <div class="flex items-center gap-2 w-full md:w-auto">
        <label for="lang-filter" class="text-xs font-bold text-slate-600 uppercase">Idioma:</label>
        <select id="lang-filter" onchange="filterProducts()" class="w-full md:w-auto border-2 border-slate-200 rounded-lg px-3 py-2 text-sm font-semibold focus:border-oshawott-blue focus:outline-none transition">
          <option value="ALL">Todos los idiomas</option>
          <option value="ESPAÑOL">Español</option>
          <option value="INGLÉS">Inglés</option>
        </select>
      </div>
    </div>

    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-8 mt-12 text-center">
    <div class="max-w-7xl mx-auto px-4 flex flex-col items-center justify-center gap-3">
      <img src="logo.jpg" alt="Logo Oshawott" class="h-10 w-10 object-contain" />
      <p class="text-xs font-bold text-slate-600">© Copyright 2026 - OshaQuest</p>
    </div>
  </footer>

  <script src="products.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", loadCatalogPage);
  </script>
</body>
</html>
