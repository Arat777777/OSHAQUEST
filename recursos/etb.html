<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Producto - OshaQuest TCG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            oshawott: {
              blue: '#0072CE',
              darkBlue: '#0055A5',
              sky: '#E6F3FF',
              bg: '#F8FAFC',
              text: '#0F172A',
              muted: '#64748B'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-oshawott-bg text-oshawott-text font-sans antialiased min-h-screen flex flex-col">

  <!-- ENCABEZADO -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      
      <a href="index.html" class="flex items-center gap-3 group">
        <img src="logo.jpg" alt="Logo Oshawott TCG" class="h-12 w-12 object-contain group-hover:scale-105 transition-transform" />
        <div>
          <span class="text-2xl font-extrabold tracking-tight text-oshawott-blue block leading-none">
            OshaQuest <span class="text-slate-800">TCG</span>
          </span>
        </div>
      </a>
      
      <nav class="hidden md:flex items-center gap-6 font-bold text-sm text-slate-700">
        <a href="catalog.html?category=etb" id="nav-etb" class="hover:text-oshawott-blue transition">ELITE TRAINER BOX</a>
        <a href="catalog.html?category=boosters" id="nav-boosters" class="hover:text-oshawott-blue transition">BOOSTERS</a>
        <a href="catalog.html?category=colecciones" id="nav-colecciones" class="hover:text-oshawott-blue transition">COLECCIONES</a>
        <a href="catalog.html?category=latas" id="nav-latas" class="hover:text-oshawott-blue transition">LATAS</a>
        <a href="catalog.html?category=blisters" id="nav-blisters" class="hover:text-oshawott-blue transition">BLISTERS</a>
      </nav>

      <div class="flex items-center gap-3">
        <a href="#" class="flex items-center gap-2 font-bold text-sm text-slate-700 hover:text-oshawott-blue px-3 py-2 rounded-lg hover:bg-oshawott-sky transition">
          <svg class="w-5 h-5 text-oshawott-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          <span class="hidden sm:inline">PERFIL</span>
        </a>
        
        <button class="relative bg-oshawott-blue hover:bg-oshawott-darkBlue text-white p-2.5 rounded-xl transition shadow-md shadow-oshawott-blue/20">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"></path>
          </svg>
          <span class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[11px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- BREADCRUMBS (MARCO / BANDA AZUL) -->
  <section class="bg-oshawott-blue text-white py-3 shadow-inner">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center gap-2 text-xs font-semibold">
      <a href="index.html" class="hover:underline">Home</a>
      <span>&gt;</span>
      <a id="breadcrumb-category" href="catalog.html?category=etb" class="hover:underline">Cargando...</a>
      <span>&gt;</span>
      <span id="breadcrumb-title" class="text-sky-200 truncate">Cargando...</span>
    </div>
  </section>

  <!-- CONTENIDO DEL PRODUCTO -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    <div class="bg-white rounded-2xl border border-slate-200 p-6 md:p-10 shadow-md grid grid-cols-1 md:grid-cols-2 gap-10">
      
      <!-- IMAGEN PRINCIPAL -->
      <div class="flex flex-col items-center">
        <div id="product-img-container" class="w-full h-80 md:h-96 bg-slate-50 rounded-2xl border border-slate-200 p-4 flex items-center justify-center">
          <img id="product-image" src="" alt="Cargando..." class="max-h-full object-contain hover:scale-105 transition-transform duration-300" />
        </div>
      </div>

      <!-- INFORMACIÓN DEL PRODUCTO -->
      <div class="flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-2">
            <span id="product-status" class="text-xs font-extrabold px-3 py-1 rounded-full uppercase">
              CARGANDO...
            </span>
            <span id="product-language" class="text-xs font-bold text-slate-500 uppercase">IDIOMA: ESPAÑOL</span>
          </div>

          <h1 id="product-title" class="text-2xl md:text-3xl font-black text-slate-800 leading-tight mt-2">
            Cargando producto...
          </h1>

          <div class="my-6">
            <span id="product-price" class="text-3xl md:text-4xl font-black text-oshawott-blue">$0 MXN</span>
            <p class="text-xs text-oshawott-muted font-semibold mt-1">Impuestos incluidos. Envío calculado al pagar.</p>
          </div>

          <div class="flex items-center gap-4 mb-8">
            <div class="flex items-center border-2 border-slate-200 rounded-xl overflow-hidden">
              <button onclick="decrementQuantity()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 font-bold text-slate-700">-</button>
              <input id="product-qty" type="number" value="1" min="1" class="w-12 text-center font-bold text-slate-800 focus:outline-none" />
              <button onclick="incrementQuantity()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 font-bold text-slate-700">+</button>
            </div>
            
            <button id="add-to-cart-btn" class="flex-1 bg-oshawott-blue hover:bg-oshawott-darkBlue text-white font-extrabold py-3.5 rounded-xl text-sm transition shadow-lg shadow-oshawott-blue/30 uppercase tracking-wider">
              Añadir al carrito
            </button>
          </div>

          <div class="border-t border-slate-200 pt-6">
            <h2 class="font-extrabold text-slate-800 text-sm mb-3 uppercase">El producto incluye:</h2>
            <ul id="product-includes" class="text-xs text-slate-600 space-y-2 list-disc list-inside font-medium">
            </ul>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="bg-white border-t border-slate-200 py-8 mt-12 text-center">
    <div class="max-w-7xl mx-auto px-4 flex flex-col items-center justify-center gap-3">
      <img src="logo.jpg" alt="Logo Oshawott" class="h-10 w-10 object-contain" />
      <p class="text-xs font-bold text-slate-600">© Copyright 2026 - OshaQuest</p>
    </div>
  </footer>

  <script src="products.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", loadProduct);
  </script>
</body>
</html>
